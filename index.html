<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Book Tracker</title>

    <!-- Connects to the bootstrap-->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    />

    <!-- Connects my style.css -->
    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <!-- Book Header ... Visible on the top of the page -->
    <header>
      <nav class="head-container">
        <h1>Book Tracker</h1>
        <a href="#/Home">Home</a>
        <a href="#/My_Reading_List">My Reading List</a>
        <a href="#/About"> About </a>
      </nav>
    </header>

    <!-- Explore Books ... Main of the page, it will display at the centre of the page at the top-->
    <main>
      <!-- Welcome Banner ... Full-width welcome section -->
      <section class="welcome-banner">
        <h2>Welcome to the Book Tracker</h2>
        <p>
          Rate the books you've read and keep track of all your reading list.
        </p>
        <a href="#book-list" class="btn btn-outline-warning btn-lg"
          >Explore Books</a
        >
      </section>

      <div class="container">
        <button id="sort-btn" class="btn btn-primary btn-lg">
          Sort by Rating
        </button>

        <div
          id="book-list"
          class="row row-cols-1 row-cols-md-2 row-cols-lg-3"
        ></div>
      </div>
    </main>

    <!--Connects my JavaScript file -->
    <script src="js/script.js"></script>
  </body>
</html>
